[package]
name = "frost-pass-cli"
version = "0.1.0"
description = "Terminal app for FrostPass organizers, minters, buyers and scanners"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "frost_pass_cli"

[[bin]]
name = "frostpass"
path = "src/main.rs"

[dependencies]
frost-pass = { path = "../programs/frost-pass", features = ["no-entrypoint"] }
frost-pass-client = { path = "../client" }
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
mpl-core = "0.12.1"
anyhow = "1"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "3.4.0"
solana-account-decoder-client-types = "3"
solana-commitment-config = "3"
solana-keypair = "3.0.1"
solana-rpc-client = { version = "3.1", default-features = false }
solana-rpc-client-api = "3.1"
solana-signature = { version = "3", features = ["verify"] }
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
solana-transaction-status-client-types = "3.1"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
